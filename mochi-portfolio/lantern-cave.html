<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Cave — Mochi's Game</title>
  <meta name="description" content="Move the lantern to find hidden treasures in a dark cave.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="cave" data-nav="projects.html" data-says="It's dark in here…|Find the 5 treasures! 💎|Move your lantern slowly.">
<main id="main" class="wrap">
  <div class="section-head" style="margin-top:10px">
    <span class="eyebrow">Project 4</span>
    <h1>Lantern <span class="grad">Cave</span></h1>
    <p>Move your mouse (or drag your finger) to light the way. Tap a treasure when you find it!</p>
  </div>

  <div class="cave-hud">
    <div class="stat">Found<b><span id="found">0</span> / 5</b></div>
    <button class="btn alt" id="resetBtn" type="button">🔄 New cave</button>
  </div>

  <div class="cave" id="cave" aria-label="A dark cave. Move the lantern to find treasures.">
    <div class="dark"></div>
    <div class="torch" aria-hidden="true">🏮</div>
  </div>

  <div style="text-align:center;margin-top:34px"><a class="btn alt" href="projects.html">← Back to projects</a></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="js/rex.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
<script src="js/pages/lantern-cave.js"></script>
</body>
</html>
